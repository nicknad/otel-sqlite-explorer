# golangci-lint v2 configuration
# Docs: https://golangci-lint.run/
version: "2"

run:
  timeout: 3m

formatters:
  enable:
    - goimports
  settings:
    goimports:
      local-prefixes:
        - log-explorer

linters:
  enable:
    # ── Standard correctness ──
    - govet
    - errcheck
    - staticcheck
    - unused
    - ineffassign

    # ── Security ──
    - gosec

    # ── Style & correctness ──
    - revive
    - misspell
    - unconvert
    - usestdlibvars
    - dupword
    - intrange
    - mirror
    - perfsprint

    # ── Performance & memory ──
    - prealloc
    - noctx
    - bodyclose

    # ── Code quality ──
    - gocritic
    - testifylint
    - modernize
    - nakedret

  settings:
    govet:
      enable-all: true
      disable:
        - fieldalignment

    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
          severity: warning
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: if-return
          severity: warning
        - name: increment-decrement
        - name: var-naming
          severity: warning
          arguments:
            - ["ID", "TTL", "URL", "HTTP", "JSON", "API", "AEAD", "KDF", "AppID", "SecretID", "AppRole"]
            - []
        - name: var-declaration
        - name: range
          severity: warning
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
          severity: warning
        - name: indent-error-flow
          severity: warning
        - name: errorf
        - name: empty-block
          severity: warning
        - name: superfluous-else
          severity: warning
        - name: unused-parameter
          severity: warning
        - name: unreachable-code
        - name: redefines-builtin-id

    gocritic:
      enable-all: true
      disabled-checks:
        - whyNoLint
        - unnamedResult
        - ifElseChain
        - appendAssign

    gosec:
      excludes:
        - G104
        - G307

    staticcheck:
      checks:
        - all
        - -ST1000
        - -ST1003
        - -ST1016
        - -SA1019

  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec
          - noctx
          - bodyclose
          - unparam
          - gocritic
      - path: cmd/
        linters:
          - gocritic
          - revive
    generated: lax
