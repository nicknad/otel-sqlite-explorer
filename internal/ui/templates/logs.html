<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log Explorer</title>
<script src="/static/htmx.min.js"></script>
  <link rel="stylesheet" href="/static/style.css">
</head>

<body>
  <h1>🔍 Log Explorer</h1>

  <!-- Full-text search bar (FTS5). Maps to a DSL match node.
       Rendered only when the backing database exposes a logs_fts index. -->
  {{if .HasFTS}}
  <form class="filters" style="margin-bottom:1rem;" id="search-form" method="get" action="/logs" hx-get="/logs"
    hx-target="#results" hx-swap="outerHTML" hx-indicator="#spinner" hx-select="#results" hx-push-url="true"
    hx-include="#log-form">
    <label style="flex:1; min-width:240px;"> Search (full-text)
      <input type="text" name="search" placeholder="e.g. timeout gateway" value="{{.Search}}" style="min-width:100%">
      <small style="color:#8b949e">FTS5: words match independently across body &amp; service</small>
    </label>
    <button type="submit" class="fts-button">Search</button>
  </form>
  {{else}}
  <p class="fts-note">
    Full-text search unavailable: this database has no <code>logs_fts</code> index.
    Use the &ldquo;Body&rdquo; filter below for substring matching instead.
  </p>
  {{end}}

  <!-- Filter form — submits via HTMX (swaps tbody + pager) or plain POST. -->
  <form class="filters" id="log-form" method="get" action="/logs" hx-get="/logs" hx-target="#results"
    hx-swap="outerHTML" hx-indicator="#spinner" hx-select="#results" hx-push-url="true">
    <label> Service
      <input type="text" name="service_name" placeholder="my-service" value="{{.Service}}">
    </label>
    <label> Severity
      <select name="severity">
        <option value="">Any</option>
        <option value="ERROR" {{if eq .Severity "ERROR" }}selected{{end}}>ERROR</option>
        <option value="WARN" {{if eq .Severity "WARN" }}selected{{end}}>WARN</option>
        <option value="INFO" {{if eq .Severity "INFO" }}selected{{end}}>INFO</option>
        <option value="DEBUG" {{if eq .Severity "DEBUG" }}selected{{end}}>DEBUG</option>
      </select>
    </label>
    <label> Trace ID
      <input type="text" name="trace_id" placeholder="hex trace id" value="{{.TraceID}}">
    </label>
    <label> Span ID
      <input type="text" name="span_id" placeholder="hex span id" value="{{.SpanID}}">
    </label>
    <label> Body
      <input type="text" name="body" placeholder="search body text" value="{{.Body}}">
    </label>
    <label> Since
      <select name="since">
        <option value="" {{if eq .Since "" }}selected{{end}}>All time</option>
        <option value="1h" {{if eq .Since "1h" }}selected{{end}}>1 hour</option>
        <option value="6h" {{if eq .Since "6h" }}selected{{end}}>6 hours</option>
        <option value="24h" {{if eq .Since "24h" }}selected{{end}}>24 hours</option>
        <option value="72h" {{if eq .Since "72h" }}selected{{end}}>3 days</option>
        <option value="168h" {{if eq .Since "168h" }}selected{{end}}>7 days</option>
      </select>
    </label>
    <label> From
      <input type="datetime-local" name="date_from" value="{{.DateFrom}}">
    </label>
    <label> To
      <input type="datetime-local" name="date_to" value="{{.DateTo}}">
    </label>
    <label> Limit
      <input type="number" name="limit" value="{{.Limit}}" min="1" max="1000" style="width:80px">
    </label>
    <button type="submit">Query</button>
  </form>

  <div id="spinner">Loading…</div>

  <div id="results">
    <!-- Log table — tbody is the HTMX swap target -->
    <table>
      <thead>
        <tr>
          <th>Time</th>
          <th>Service</th>
          <th>Level</th>
          <th>Trace</th>
          <th>Span</th>
          <th>Body</th>
        </tr>
      </thead>
      <tbody id="log-table-body">
        {{template "rows" .}}
      </tbody>
    </table>

    <!-- Pagination — submits the same form with a modified offset. -->
    <div id="pager" class="pager">
      <button type="submit" form="log-form" name="offset" value="{{sub .Offset .Limit}}" class="secondary" {{if not
        .HasPrev}}disabled{{end}}>◀ Prev</button>
      <span>showing {{len .Logs}} rows from offset {{.Offset}}</span>
      <button type="submit" form="log-form" name="offset" value="{{add .Offset .Limit}}" class="secondary" {{if not
        .HasNext}}disabled{{end}}>Next ▶</button>
    </div>
  </div>
</body>

</html>
