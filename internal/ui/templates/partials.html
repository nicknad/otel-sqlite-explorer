{{/* partials.html — HTMX partial: returns only <tr> rows for tbody swap */}}
{{define "rows"}}
{{range .Logs}}
<tr>
  <td class="timestamp mono"><a href="/logs/{{.ID}}" style="color:inherit;text-decoration:none">{{.Timestamp | nstime}}</a></td>
  <td>{{.ServiceName}}</td>
  <td class="sev-{{.Severity | lower}}">{{.Severity}}</td>
  <td class="mono truncate">{{.TraceID}}</td>
  <td class="mono truncate">{{.SpanID}}</td>
  <td class="truncate">{{.Body}}</td>
</tr>
{{else}}
<tr>
  <td colspan="6" style="text-align:center; padding:2rem; color:#8b949e;">No logs found</td>
</tr>
{{end}}
{{end}}
