{{/* partials.html — HTMX partial: returns only <tr> rows for tbody swap */}}
  {{define "rows"}}
  {{range .Logs}}
<tr>
  <td class="timestamp mono" title="{{.Timestamp | nstimeFull}}"><a
      href="/logs/{{.ID}}{{$.QuerySuffix}}">{{.Timestamp | nstime}}</a></td>
  <td>{{.ServiceName}}</td>
  <td class="sev-{{.Severity | lower}}">{{.Severity}}</td>
  <td class="mono truncate">{{if .TraceID}}<a href="/logs?trace_id={{.TraceID}}">{{.TraceID}}</a>{{end}}</td>
  <td class="mono truncate">{{if .SpanID}}<a href="/logs?span_id={{.SpanID}}">{{.SpanID}}</a>{{end}}</td>
  <td class="truncate body-cell" title="{{.Body}}">{{.Body}}</td>
</tr>
{{else}}
<tr>
  <td colspan="6" style="text-align:center; padding:2rem; color:#8b949e;">No logs found</td>
</tr>
{{end}}
{{end}}
