{{/* error.html — styled error page for browser-facing failures */}}
{{define "error.html"}}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{.Status}} — Log Explorer</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <a class="back" href="/logs">← Back to logs</a>
  <div class="card error-card">
    <h1>{{.Status}}</h1>
    <p>{{.Message}}</p>
  </div>
</body>
</html>
{{end}}
