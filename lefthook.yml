# ── Lefthook git hooks ─────────────────────────────────────────────────────────
# Docs: https://github.com/evilmartians/lefthook
#
# Pre-commit: fast checks before every commit (format + lint + vet)
# Pre-push:   full suite (lint, security, tests, build)

commit-msg:
  commands:
    lint-commit:
      run: echo "✅ commit message ok"

pre-commit:
  parallel: false
  commands:
    tidy:
      run: go mod tidy && git add go.mod go.sum
      stage_fixed: true
      skip:
        - merge
        - rebase

    lint-fix:
      run: golangci-lint run --fix --timeout 2m
      glob: "*.go"
      stage_fixed: true

    vet:
      run: go vet ./...
      glob: "*.go"

    check-newlines:
      run: git diff --cached --name-only --diff-filter=ACM | xargs -I {} sh -c 'tail -c1 {} | read -r _ || echo {}' 2>/dev/null | head -20 | grep -q . && exit 1 || exit 0
      skip:
        - merge
        - rebase

pre-push:
  parallel: false
  commands:
    full-lint:
      run: golangci-lint run --timeout 5m

    security:
      run: |
        which gosec >/dev/null 2>&1 || go install github.com/securego/gosec/v2/cmd/gosec@latest
        gosec -quiet -exclude-dir vendor ./...

    test:
      run: go test -count=1 -race -timeout 60s ./...

    build:
      run: go build -o /dev/null ./cmd/...

    vendorsec:
      run: |
        which nancy >/dev/null 2>&1 || go install github.com/sonatype-nexus-community/nancy@latest
        go list -m all | nancy sleuth -q --skip-update-check 2>/dev/null || true
